<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sant Designer | Identidade Visual para Eventos e Artistas</title>
    <meta name="description" content="Otimiza o SEO do site com títulos e descrições das páginas, além de melhorar a velocidade de carregamento e as métricas de Core Web Vitals." />
    <meta property="og:title" content="Sant Designer | Identidade Visual para Eventos e Artistas" />
    <meta property="og:description" content="Identidade visual completa para sua música, eventos e artistas. Impacto e profissionalismo no mercado musical." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Sant Designer",
      "image": "https://santdesigner.lovable.app/favicon.png",
      "@id": "https://santdesigner.lovable.app",
      "url": "https://santdesigner.lovable.app",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Brasil",
        "addressCountry": "BR"
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday"
        ],
        "opens": "09:00",
        "closes": "18:00"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5.0",
        "reviewCount": "50"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
